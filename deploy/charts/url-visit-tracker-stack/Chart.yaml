apiVersion: v2
name: url-visit-tracker-stack
description: Local Kubernetes stack for the URL Visit Tracker
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: url-visit-tracker
    version: 0.1.0
    repository: file://../url-visit-tracker
    condition: url-visit-tracker.enabled
  - name: postgresql
    version: 18.11.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled

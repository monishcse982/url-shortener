name: Build and safety checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint, typecheck, and test
        run: npm run lint && npm run typecheck && npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  python:
    name: Python quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --group dev --python 3.12
      - name: Lint
        run: uv run --locked --no-sync ruff check .
      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .
      - name: Run unit tests
        run: uv run --locked --no-sync coverage run -m unittest discover -s tests/unit -v
      - name: Report line and branch coverage
        run: uv run --locked --no-sync coverage report

  helm:
    name: Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register Valkey chart repository
        run: helm repo add valkey https://valkey.io/valkey-helm/
      - name: Build locked dependencies, lint, and render
        run: make chart-validate HELM_CONTEXT=

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --tag shawty:ci .
      - name: Build static UI image
        run: |
          docker build --tag shawty-ui:ci \
            --build-arg VITE_API_BASE_URL=http://localhost:8080 \
            --build-arg VITE_COGNITO_ISSUER=https://cognito-idp.example.com/example \
            --build-arg VITE_COGNITO_CLIENT_ID=ci-public-client \
            --build-arg VITE_COGNITO_DOMAIN=https://login.example.com \
            --build-arg VITE_COGNITO_REDIRECT_URI=http://localhost:5173/auth/callback \
            --build-arg VITE_COGNITO_LOGOUT_URI=http://localhost:5173/ \
            frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check committed content and file paths
        run: python3 scripts/check-git-content.py --working-tree
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

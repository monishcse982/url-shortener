[project]
name = "url-visit-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "asyncpg==0.32.0",
    "confluent-kafka==2.16.0",
    "fastapi==0.143.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic==2.14.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "starlette==1.7.0",
    "tortoise-orm>=1.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "locust>=2.46.4",
    "ruff==0.16.10",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
